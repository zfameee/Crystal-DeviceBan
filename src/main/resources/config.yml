messages:
  prefix: "&8[&bCrystal-DeviceBan&8] "

  banned:
    player: "{prefix}&cВы заблокированы!"
    reason: "&7Причина: &f{reason}"
    fingerprint: "&7ID устройства: &f{fingerprint}"

  ban:
    usage: "{prefix}&cИспользование: /crystaldeviceban <игрок> [причина]"
    player-not-found: "{prefix}&cИгрок &f{player} &cне найден."
    success: "{prefix}&aИгрок &f{player} &aзаблокирован."
    fingerprint: "{prefix}&7Fingerprint: &f{fingerprint}"

  unban:
    usage: "{prefix}&cИспользование: /deviceunban <fingerprint>"
    not-found: "{prefix}&cТакой блокировки нет."
    success: "{prefix}&aБлокировка снята."

  info:
    usage: "{prefix}&cИспользование: /deviceinfo [игрок]"
    not-found: "{prefix}&cИгрок не найден."
    result:
      player: "{prefix}&7Игрок: &f{player}"
      fingerprint: "{prefix}&7Fingerprint: &f{fingerprint}"
      status-banned: "{prefix}&7Статус: &cЗАБЛОКИРОВАН"
      status-ok: "{prefix}&7Статус: &aРАЗРЕШЁН"

  errors:
    no-permission: "{prefix}&cУ вас нет прав."
    player-offline: "{prefix}&cИгрок должен быть онлайн."
    address-error: "{prefix}&cНе удалось определить подключение игрока."
